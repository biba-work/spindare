org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is off: AGP 8.13.2's ProcessNavigationXmlTask fails to
# serialise its runtime-dependency file collection ("error writing value of type
# DefaultConfigurableFileCollection"), which turns every build into a hard
# failure. Re-enable once AGP fixes it — the build cache above still applies.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
